<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAM Estimate Builder — Login</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #0f2245 0%, #1a3a6e 50%, #2d6fbd 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-card {
  background: #fff; border-radius: 14px; padding: 42px 40px 36px;
  width: 380px; max-width: 95vw;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
.logo { text-align: center; margin-bottom: 28px; }
.logo h1 { font-size: 2rem; font-weight: 800; color: #1a3a6e; letter-spacing: 1px; }
.logo p  { font-size: .82rem; color: #777; margin-top: 4px; }
label { display: block; font-size: .8rem; font-weight: 600; color: #444; margin-bottom: 5px; }
input[type=text], input[type=password] {
  width: 100%; padding: 10px 13px; border: 1.5px solid #d0d7e3; border-radius: 7px;
  font-size: .9rem; font-family: inherit; transition: border-color .2s; margin-bottom: 16px;
}
input:focus { outline: none; border-color: #2d6fbd; box-shadow: 0 0 0 3px rgba(45,111,189,.12); }
.btn-login {
  width: 100%; padding: 11px; background: linear-gradient(135deg,#1a3a6e,#2d6fbd);
  color: #fff; border: none; border-radius: 7px; font-size: .95rem; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: opacity .15s; margin-top: 4px;
}
.btn-login:hover { opacity: .9; }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }
.error-msg {
  background: #fdecea; border: 1px solid #f5c6cb; color: #842029;
  border-radius: 6px; padding: 9px 13px; font-size: .82rem; margin-bottom: 14px; display: none;
}
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>RAM</h1>
    <p>Civil Works Estimate Builder</p>
  </div>
  <div class="error-msg" id="err_msg"></div>
  <div>
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
    <button class="btn-login" id="login_btn" onclick="doLogin()">Login</button>
  </div>
</div>

<script>
document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") doLogin();
});

async function doLogin() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("err_msg");
  const btn = document.getElementById("login_btn");
  err.style.display = "none";
  if (!username || !password) { showErr("Enter username and password"); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Logging in…';
  try {
    const res  = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showErr(data.error || "Login failed"); return; }
    window.location.href = "/";
  } catch(e) { showErr("Server error. Please try again."); }
  finally { btn.disabled = false; btn.innerHTML = "Login"; }
}

function showErr(msg) {
  const err = document.getElementById("err_msg");
  err.textContent = msg; err.style.display = "block";
}
</script>
</body>
</html>
